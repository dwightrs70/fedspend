[project]
name = "fedspend"
version = "0.1.0"
description = "Federal spending data platform (USAspending: DHS and Treasury) with an AI layer"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
pythonpath = ["."]
