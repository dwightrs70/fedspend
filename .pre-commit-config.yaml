# Run `pre-commit autoupdate` after installing to bump these revs to current versions.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  - repo: local
    hooks:
      - id: commit-email-is-noreply
        name: Commit email must be a GitHub no-reply address
        entry: python scripts/check_commit_email.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
